// Original abstract SVG motifs per dimension — no external images, so no
// licensing risk. Tiled as a subtle background pattern on each dimension's
// page banner. MM=gears, DR=circuit grid, IOT=sensor network, EN=energy/leaf, ORG=org-chart nodes.
function svgTile(inner, size = 160) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}' viewBox='0 0 ${size} ${size}'>${inner}</svg>`;
  // encodeURIComponent does NOT escape single quotes, but the outer CSS url('...')
  // wrapper uses single quotes — so any literal ' left over breaks the CSS string
  // early and silently invalidates the whole background-image declaration.
  const encoded = encodeURIComponent(svg).replace(/'/g, '%27');
  return `url('data:image/svg+xml,${encoded}')`;
}

const DIM_DISPLAY_NAMES = {
  IOT: 'Internet of Things Monitoring Capability',
};
function dimDisplayName(code) { return DIM_DISPLAY_NAMES[code] || dimByCode(code).name; }

function getIndicatorRecommendation(indicatorId, score) {
  const entries = INDICATOR_RECOMMENDATIONS[indicatorId];
  if (!entries) return null;
  const stageIdx = score <= 2 ? 0 : (score === 3 ? 1 : 2); // foundational / functional / advanced
  return entries[stageIdx];
}

function citationList(keys) {
  return (keys || []).map(k => {
    const ref = REFERENCES[k];
    return ref && ref.incomplete ? `${k}*` : k;
  }).join('; ');
}

function hashAnswers(answers) {
  const keys = Object.keys(answers).sort();
  const str = keys.map(k => k + ':' + answers[k]).join('|');
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return hash;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================================
   3. CALCULATION ENGINE — mirrors the Excel formulas exactly
      Scoring!E = (score-1)/(5-1)*100, excluding "Not known"
      Index_Calc!B = AVERAGE of valid scores, blank if validCount < 3
      Index_Calc!D = avg * weight (blank propagates as 0 in SUM)
      Index_Calc!B8 = SUM(weighted dims)
      Index_Calc!B9 = IFS bands on B8
      Index_Calc!B10 = COUNT(valid) / 25
========================================================================= */
function computeResults() {
  const dimResults = TOOL_DATA.dimensions.map(dim => {
    const indicators = TOOL_DATA.indicators.filter(i => i.dimension === dim.name);
    const normalized = indicators.map(ind => {
      const selIdx = state.answers[ind.id];
      if (selIdx === undefined) return null;
      const opt = ind.options[selIdx];
      if (opt.score === null || opt.score === undefined) return null; // "Not known"
      return (opt.score - 1) / (5 - 1) * 100;
    });
    const valid = normalized.filter(v => v !== null);
    const validCount = valid.length;
    const avg = validCount >= 3 ? valid.reduce((a,b) => a+b, 0) / validCount : null;
    const weighted = avg !== null ? avg * dim.weight : 0;
    return {
      dimension: dim.name, code: dim.code, weight: dim.weight,
      avg, validCount, completeness: validCount / 5, weighted, indicators,
    };
  });

  const overallIndex = dimResults.reduce((sum, d) => sum + d.weighted, 0);
  const level = LEVELS.find(l => overallIndex <= l.max) || LEVELS[LEVELS.length - 1];

  const totalValid = TOOL_DATA.indicators.reduce((n, ind) => {
    const selIdx = state.answers[ind.id];
    if (selIdx === undefined) return n;
    const opt = ind.options[selIdx];
    return (opt.score !== null && opt.score !== undefined) ? n + 1 : n;
  }, 0);
  const dataCompleteness = totalValid / 25;

  let interpretation;
  if (dataCompleteness >= 0.8) interpretation = 'Results are reasonably reliable';
  else if (dataCompleteness >= 0.6) interpretation = 'Results are indicative only – interpret cautiously';
  else interpretation = 'Insufficient data for reliable interpretation';

  const scoredDims = dimResults.filter(d => d.avg !== null);
  const weakest = scoredDims.length
    ? scoredDims.reduce((min, d) => d.avg < min.avg ? d : min)
    : null;

  const answeredScored = TOOL_DATA.indicators.map(ind => {
    const selIdx = state.answers[ind.id];
    if (selIdx === undefined) return null;
    const opt = ind.options[selIdx];
    if (opt.score === null || opt.score === undefined) return null;
    return { id: ind.id, dimension: ind.dimension, question: ind.question, opt };
  }).filter(Boolean).sort((a,b) => a.opt.score - b.opt.score); // extensive: every answered+scored indicator, worst first — not capped

  return { dimResults, overallIndex, level, dataCompleteness, interpretation, weakest, answeredScored };
}

function dimCode(dimName) {
  const d = TOOL_DATA.dimensions.find(x => x.name === dimName);
  return d ? d.code : '';
}

      const qCount = (state.questionOrder[dim.code] || []).length;

    } else if (state.view === 'methodology') msg = 'Methodology and scoring model';
    else msg = 'Results ready';

  }

function animateIntroGaugePreview() {
  const DEMO_PREVIEW_VALUE = 72;
  const level = LEVELS.find(l => DEMO_PREVIEW_VALUE <= l.max) || LEVELS[LEVELS.length - 1];
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const needle = document.getElementById('intro-gauge-needle');
  const numEl = document.getElementById('intro-gauge-number');
  const levelEl = document.getElementById('intro-gauge-level');
  if (levelEl) { levelEl.textContent = level.label; levelEl.style.color = level.color; }

  const startAngle = -90; // matches the value=0 position rendered initially
  const endAngle = (DEMO_PREVIEW_VALUE / 100) * 180 - 90;

  if (reduceMotion) {
    if (needle) needle.setAttribute('transform', `rotate(${endAngle} 100 100)`);
    if (numEl) numEl.textContent = DEMO_PREVIEW_VALUE.toFixed(1);
    return;
  }

  requestAnimationFrame(() => {
    setTimeout(() => {
      const start = performance.now();
      const duration = 1200;
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        // Drive the SVG transform attribute directly, frame by frame — CSS transitions
        // don't reliably animate the SVG 3-argument rotate(angle, cx, cy) syntax, since
        // that isn't valid CSS transform-function syntax (only the 1-argument form is).
        const currentAngle = startAngle + (endAngle - startAngle) * eased;
        if (needle) needle.setAttribute('transform', `rotate(${currentAngle} 100 100)`);
        if (numEl) numEl.textContent = (eased * DEMO_PREVIEW_VALUE).toFixed(1);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }, 300);
  });
}

function expandAcronyms(text) {
  if (!text) return text;
  return text
    .replace(/CMMS\/BMS/g, 'computerized maintenance management system or building management system')
    .replace(/\bCMMS\b/g, 'computerized maintenance management system')
    .replace(/\bBMS\b/g, 'building management system')
    .replace(/\bPdM\b/g, 'predictive maintenance');
}

function escapeAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function renderAssessment() {
  const dimCode = state.dimOrder[state.step];
  const dim = dimByCode(dimCode);
  const dimColor = DIM_COLORS[dim.code];
  const orderedIds = state.questionOrder[dim.code] || TOOL_DATA.indicators.filter(i => i.dimension === dim.name).map(i => i.id);
  const indicators = orderedIds.map(id => TOOL_DATA.indicators.find(i => i.id === id));
  const totalAnswered = Object.keys(state.answers).length;
  const answeredInCurrentDim = indicators.filter(x => state.answers[x.id] !== undefined).length;
  const dimScorable = answeredInCurrentDim >= 3;

  const tabs = state.dimOrder.map((code, i) => {
    const d = dimByCode(code);
    const c = DIM_COLORS[d.code];
    const dIndicators = TOOL_DATA.indicators.filter(x => x.dimension === d.name);
    const answeredInDim = dIndicators.filter(x => state.answers[x.id] !== undefined).length;
    const scorable = answeredInDim >= 3;
    const pct = (answeredInDim / 5) * 100;
    const active = i === state.step;
    return `
      <button data-step="${i}" role="tab" aria-selected="${active}" tabindex="${active ? 0 : -1}"
        title="${escapeAttr(dimDisplayName(d.code))}"

        <div class="h-1.5 rounded-full bg-hair overflow-hidden">
          <div class="seg h-full rounded-full" style="width:${pct}%; background:${c}; opacity:${active ? 1 : 0.5}"></div>
        </div>
        <span class="font-mono text-[10px] tracking-wider flex items-center gap-1" style="color:${active ? c : '#5C7568'}">
          ${d.code}${scorable ? ' ✓' : ''}
        </span>
      </button>`;
  }).join('');

  // Clamp defensively in case the dimension changed and has fewer questions than the old step
  if (state.questionStep > indicators.length - 1) state.questionStep = 0;
  if (state.questionStep < 0) state.questionStep = 0;
  const ind = indicators[state.questionStep];

  const selected = state.answers[ind.id];
  const selectedOpt = selected !== undefined ? ind.options[selected] : null;
  const opts = ind.options.map((opt, idx) => {
    const isUnknown = opt.text === 'Not known';
    const isSel = selected === idx;
    const selStyle = isSel && !isUnknown ? `border-color:${dimColor}; background-color:${dimColor}18;` : '';
    const tabIdx = isSel ? 0 : (selected === undefined && idx === 0 ? 0 : -1);
    return `
      <button data-ind="${ind.id}" data-idx="${idx}" role="radio" aria-checked="${isSel}" tabindex="${tabIdx}"
        class="option-card ${isSel ? 'selected' : ''} ${isUnknown ? 'unknown' : ''}
        w-full text-left border border-hair ${isUnknown ? 'border-dashed' : ''} rounded-lg px-4 py-3 bg-panel flex items-start gap-3"
        style="${selStyle}">
        <span class="mt-0.5 w-4 h-4 rounded-full border flex-shrink-0" style="${isSel && !isUnknown ? `border-color:${dimColor}; background-color:${dimColor};` : (isSel ? 'border-color:#94a3b8;background-color:#94a3b8;' : 'border-color:#DCEBE2;')}"></span>
        <span class="text-sm ${isUnknown ? 'text-dim italic' : 'text-ink'}">${expandAcronyms(opt.text)}</span>

  }).join('');

  const infoPanel = (selectedOpt && selectedOpt.text !== 'Not known' && selectedOpt.description) ? `

  state._animateQuestion = false;

  const dots = indicators.map((_, i) => {
    const isCurrent = i === state.questionStep;
    const dotAnswered = state.answers[indicators[i].id] !== undefined;

    </div>`;

  const questions = `
    ${questionNav}
    <div class="${animateClass} border border-hair bg-panel rounded-xl p-5 sm:p-6 shadow-sm" style="border-left: 4px solid ${dimColor};">
      <div class="flex items-center gap-2 mb-3">
        <span class="font-mono text-xs font-semibold" style="color:${dimColor}" title="Reference ID: ${ind.id}">${INDICATOR_LABELS[ind.id] || ind.id}</span>

      <div class="space-y-2" data-optgroup role="radiogroup" aria-labelledby="q-${ind.id}">${opts}</div>
      ${infoPanel}
    </div>`;

  const isLast = state.step === state.dimOrder.length - 1;

  return `
  <div class="fade-in">
    <div class="flex items-center justify-between mb-2">
      <span class="font-mono text-dim text-xs">${totalAnswered} / 25 answered</span>
      <div class="flex gap-4">

    <div class="relative overflow-hidden rounded-2xl mb-6 border border-hair bg-panel">

        </div>

            ${answeredInCurrentDim}/5 answered — ${dimScorable ? 'scorable' : `need ${3 - answeredInCurrentDim} more for a score`}
          </span>
        </div>
      </div>
    </div>

    <div class="space-y-4">${questions}</div>

    <div class="flex items-center justify-between mt-9">
      <button id="back-btn" class="${state.step === 0 ? 'invisible' : ''} font-mono text-sm text-dim hover:text-ink transition-colors px-4 py-2">
        ← Back
      </button>
      <button id="next-btn" class="inline-flex items-center gap-2 btn-grad text-white font-semibold px-6 py-3 rounded-full transition-all">
        ${isLast ? 'View results' : 'Next dimension'}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>`;
}

function renderGauge(value, level, needleId) {
  const angle = (value / 100) * 180;
  const cx = 100, cy = 100, r = 78;
  const bandArcs = LEVELS.map((l, i) => {
    const startPct = i === 0 ? 0 : LEVELS[i-1].max;
    const a0 = (startPct/100)*180, a1 = (l.max/100)*180;
    const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
    const largeArc = (a1 - a0) > 180 ? 1 : 0;
    return `<path d="M ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y}" stroke="${l.color}" stroke-width="15" fill="none" stroke-linecap="round"/>`;
  }).join('');

  return `
  <svg viewBox="0 0 200 118" class="w-full max-w-[280px] mx-auto">
    ${bandArcs}
    <line ${needleId ? `id="${needleId}"` : ''} class="needle" x1="100" y1="100" x2="100" y2="30" stroke="#0F2A1F" stroke-width="3" stroke-linecap="round"
      transform="rotate(${angle - 90} 100 100)" />
    <circle cx="100" cy="100" r="7" fill="#0F2A1F"/>
    <circle cx="100" cy="100" r="7" fill="none" stroke="${level.color}" stroke-width="2.5"/>
  </svg>`;
}
function polar(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 180) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function renderResults() {
  const r = computeResults();

  const dimRows = r.dimResults.map(d => {
    const c = DIM_COLORS[d.code];
    const insufficient = d.avg === null;
    const pct = insufficient ? 0 : d.avg;
    const isWeakest = r.weakest && r.weakest.code === d.code;
    return `
      <div class="border ${isWeakest ? '' : 'border-hair'} bg-panel rounded-xl p-4 shadow-sm" style="${isWeakest ? 'border:2px solid #F2994A;' : ''} border-left: 4px solid ${c};">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="font-mono text-xs" style="color:${c}">${d.code}</span>
            <span class="text-sm text-ink font-medium">${dimDisplayName(d.code)}</span>
            ${isWeakest ? '<span class="font-mono text-[10px] text-white rounded-full px-2 py-0.5" style="background:#F2994A;">WEAKEST</span>' : ''}
          </div>
          <span class="font-mono text-xs text-dim">wt ${Math.round(d.weight*100)}%</span>
        </div>
        <div class="h-2.5 rounded-full bg-hair overflow-hidden mb-2">
          <div class="seg h-full rounded-full" style="width:${pct}%; background:${insufficient ? '#B8C6BE' : c};"></div>
        </div>
        <div class="flex items-center justify-between font-mono text-xs">
          <span class="${insufficient ? 'text-dim italic' : 'text-ink'}">${insufficient ? 'Insufficient data — needs ≥3 of 5 answered' : d.avg.toFixed(1) + ' / 100'}</span>
          <span class="text-dim">${d.validCount}/5 answered</span>
        </div>
      </div>`;
  }).join('');

  // Group every answered+scored indicator by dimension for the extensive, cited recommendations list.
  const recsByDim = {};
  r.answeredScored.forEach(a => {
    const code = dimCode(a.dimension);
    (recsByDim[code] = recsByDim[code] || []).push(a);
  });

  const recs = TOOL_DATA.dimensions.map(d => {
    const items = recsByDim[d.code];
    if (!items || !items.length) return '';
    const c = DIM_COLORS[d.code];
    const cards = items.map(a => {
      const rec = getIndicatorRecommendation(a.id, a.opt.score);
      if (!rec) return '';
      const cites = citationList(rec.citations);
      return `
      <div class="border border-hair bg-panel rounded-xl p-4 shadow-sm" style="border-left: 4px solid ${c};">
        <div class="flex items-center gap-2 mb-1 flex-wrap">
          <span class="font-mono text-xs font-semibold" style="color:${c}" title="Reference ID: ${a.id}">${INDICATOR_LABELS[a.id] || a.id}</span>
          <span class="font-mono text-xs text-dim">score ${a.opt.score}/5</span>
        </div>
        <p class="text-sm text-dim mb-2">${expandAcronyms(a.question)}</p>
        <p class="text-sm text-ink mb-2">→ ${expandAcronyms(rec.text)}</p>
        <p class="font-mono text-[10px] text-dim/70">Source: ${cites}</p>
      </div>`;
    }).join('');
    return `
    <div class="mb-5">
      <div class="flex items-center gap-2 mb-2">
        <span class="font-mono text-xs px-2 py-0.5 rounded-full text-white" style="background:${c}">${d.code}</span>
        <span class="text-sm text-ink font-medium">${dimDisplayName(d.code)}</span>
        <span class="font-mono text-[11px] text-dim ml-auto">${items.length} recommendation${items.length === 1 ? '' : 's'}</span>
      </div>
      <div class="space-y-3">${cards}</div>
    </div>`;
  }).join('') || `<p class="text-dim text-sm">No recommendations yet — answer some questions to see evidence-grounded guidance here.</p>`;

  const hasIncompleteCitation = r.answeredScored.some(a => {
    const rec = getIndicatorRecommendation(a.id, a.opt.score);
    return rec && (rec.citations || []).some(c => REFERENCES[c] && REFERENCES[c].incomplete);
  });

  const referencesUsed = new Set();
  r.answeredScored.forEach(a => {
    const rec = getIndicatorRecommendation(a.id, a.opt.score);
    if (rec && rec.citations) rec.citations.forEach(c => referencesUsed.add(c));
  });
  (LEVEL_NARRATIVES[LEVELS.indexOf(r.level)] || []).forEach(v => (v.citations || []).forEach(c => referencesUsed.add(c)));
  if (r.weakest) (DIM_NUDGES[r.weakest.code] || []).forEach(v => (v.citations || []).forEach(c => referencesUsed.add(c)));

  const referencesList = Array.from(referencesUsed).sort().map(key => {
    const ref = REFERENCES[key];
    if (!ref) return '';
    return `<li class="${ref.incomplete ? 'text-amber-700' : 'text-dim'}">${ref.incomplete ? '⚠ ' : ''}${ref.full}</li>`;
  }).join('');

  const metaLine = [state.metadata.facility, state.metadata.assessor, state.metadata.date]
    .filter(Boolean).length > 0 ? `
    <div class="flex flex-wrap gap-x-5 gap-y-1 text-xs text-dim mb-4 font-mono">
      ${state.metadata.facility ? `<span>Facility: <span class="text-ink">${escapeAttr(state.metadata.facility)}</span></span>` : ''}
      ${state.metadata.assessor ? `<span>Assessor: <span class="text-ink">${escapeAttr(state.metadata.assessor)}</span></span>` : ''}
      ${state.metadata.date ? `<span>Date: <span class="text-ink">${escapeAttr(state.metadata.date)}</span></span>` : ''}
    </div>` : '';

  const demoBanner = state.isDemo ? `
    <div class="flex items-center justify-between gap-4 flex-wrap border rounded-xl px-4 py-3 mb-6" style="border-color:#F2994A; background:#F2994A0F;">
      <span class="text-sm text-ink">You're viewing <span class="font-semibold">sample demo data</span>, not a real assessment.</span>
      <button id="start-own-btn" class="no-print font-mono text-xs text-white px-4 py-2 rounded-full btn-grad">Start your own assessment</button>
    </div>` : '';

  return `
  <div class="fade-in">
    <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
      <h2 class="font-display text-2xl text-ink">Assessment Results</h2>
      <div class="flex gap-3 no-print flex-wrap items-center">
        <button id="go-home-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Home</button>
        <button data-goto-methodology class="font-mono text-xs text-dim hover:text-ink transition-colors">Methodology</button>
        <button id="edit-answers-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">← Edit answers</button>
        <span class="w-px h-3 bg-hair"></span>
        <button id="export-csv-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Export CSV</button>
        <button id="export-json-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Export JSON</button>
        <button id="download-pdf-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Download PDF</button>
        <button id="print-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Print</button>
        <span class="w-px h-3 bg-hair"></span>
        <button id="restart-btn" class="font-mono text-xs text-dim hover:text-ink transition-colors">Restart</button>
      </div>
    </div>

    ${demoBanner}

    <div class="flex gap-1 mb-6 border-b border-hair no-print">
      <button id="results-tab-summary" class="font-mono text-xs px-4 py-2.5 border-b-2 transition-colors" style="${state.resultsTab === 'summary' ? 'border-color:#1DB870; color:#0F2A1F;' : 'border-color:transparent; color:#5C7568;'}">Results</button>
      <button id="results-tab-references" class="font-mono text-xs px-4 py-2.5 border-b-2 transition-colors" style="${state.resultsTab === 'references' ? 'border-color:#1DB870; color:#0F2A1F;' : 'border-color:transparent; color:#5C7568;'}">References <span class="text-dim/60">(${referencesUsed.size})</span></button>
    </div>

    <div id="report-content">
    <div class="${state.resultsTab === 'summary' ? '' : 'results-tab-hidden'}">
    ${state.isDemo ? '<p class="text-xs font-mono text-dim mb-3">⚠ Sample demonstration data — not a real facility assessment.</p>' : ''}
    ${metaLine}
    <div class="flex gap-1.5 mb-6 max-w-md">${spectrumStrip(null)}</div>

    <div class="grid sm:grid-cols-[280px_1fr] gap-8 items-center border border-hair bg-panel rounded-2xl p-6 sm:p-8 mb-8 shadow-sm">
      ${renderGauge(r.overallIndex, r.level)}
      <div>
        <div class="font-mono text-dim text-xs tracking-wider mb-1">OVERALL PREDICTIVE MAINTENANCE INDEX</div>
        <div class="font-display text-5xl text-ink mb-2">${r.overallIndex.toFixed(1)}<span class="text-xl text-dim">/100</span></div>
        <div class="inline-block font-mono text-sm px-3 py-1 rounded-full text-white" style="background:${r.level.color}">${r.level.label}</div>
        <div class="mt-4 text-sm text-dim">
          Data completeness: <span class="text-ink font-mono">${Math.round(r.dataCompleteness*100)}%</span> — ${r.interpretation}
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 mb-8 text-xs text-dim">
      <span style="color:#1DB870;">✓</span> Calculation logic verified against the source model. Recommendations below are evidence-grounded — each cites a published source (see the References tab above).
    </div>

    <h3 class="font-mono text-dim text-xs tracking-wider mb-3">DIMENSION BREAKDOWN</h3>
    <div class="grid sm:grid-cols-2 gap-3 mb-8">${dimRows}</div>

    ${renderNarrative(r)}

    <div class="flex items-center justify-between mb-3">
      <h3 class="font-mono text-dim text-xs tracking-wider">RECOMMENDATIONS <span class="text-dim/60">(${r.answeredScored.length}, evidence-grounded)</span></h3>
    </div>
    ${recs}
    </div>

    <div class="${state.resultsTab === 'references' ? '' : 'results-tab-hidden'}">
    ${referencesList ? `
    <h3 class="font-mono text-dim text-xs tracking-wider mb-3">REFERENCES <span class="text-dim/60">(${referencesUsed.size} cited on this page)</span></h3>
    <ul class="text-xs leading-relaxed space-y-2.5 list-none max-w-3xl">${referencesList}</ul>
    ${hasIncompleteCitation ? '<p class="text-[11px] text-amber-700 mt-3">⚠ One or more citations above are incomplete in the source thesis and need the full reference located before this tool is examined or published.</p>' : ''}
    ` : '<p class="text-dim text-sm">No references yet — answer some questions to see evidence-grounded citations here.</p>'}
    </div>
    </div>
  </div>`;
}

function renderNarrative(r) {
  const levelIdx = LEVELS.indexOf(r.level);
  const variants = LEVEL_NARRATIVES[levelIdx];
  const h = hashAnswers(state.answers);
  const narrative = variants[h % variants.length];

  const dimNudge = r.weakest ? DIM_NUDGES[r.weakest.code][(h >>> 3) % DIM_NUDGES[r.weakest.code].length] : null;
  const weakestColor = r.weakest ? DIM_COLORS[r.weakest.code] : null;

  return `
  <div class="mb-8">
    <h3 class="font-mono text-dim text-xs tracking-wider mb-3">WHAT THIS MEANS FOR YOU</h3>
    <div class="border border-hair bg-panel rounded-xl p-5 sm:p-6 shadow-sm space-y-4" style="border-left: 4px solid ${r.level.color};">
      <p class="text-ink text-[15px] leading-relaxed">${narrative.summary}</p>
      <div>
        <div class="font-mono text-[11px] tracking-wider mb-1" style="color:${r.level.color}">ENERGY & EFFICIENCY IMPACT</div>
        <p class="text-sm text-dim leading-relaxed">${narrative.energyImpact}</p>
      </div>
      <div>
        <div class="font-mono text-[11px] tracking-wider mb-1" style="color:${r.level.color}">RECOMMENDATION</div>
        <p class="text-sm text-dim leading-relaxed">${narrative.recommendation}</p>
      </div>
      <p class="font-mono text-[10px] text-dim/70">Source: ${citationList(narrative.citations)}</p>
      ${dimNudge ? `
      <div class="rounded-lg px-4 py-3 mt-1" style="background:${weakestColor}12;">
        <div class="font-mono text-[11px] tracking-wider mb-1" style="color:${weakestColor}">FOCUS AREA — ${r.weakest.code}</div>
        <p class="text-sm text-ink leading-relaxed mb-2">${dimNudge.text}</p>
        <p class="font-mono text-[10px] text-dim/70">Source: ${citationList(dimNudge.citations)}</p>
      </div>` : ''}
      <p class="text-[11px] text-dim/70 italic pt-1">This narrative synthesises the cited evidence for readability — the source citations above are the primary record; treat this synthesis as a starting point for discussion, not a formal engineering assessment.</p>
    </div>
  </div>`;
}

/* =========================================================================
   5. EVENT HANDLERS
========================================================================= */
function attachHandlers() {
  const start = document.getElementById('start-btn');
  if (start) start.onclick = () => {
    if (!state.metadata.facility || !state.metadata.facility.trim()) {
      state.metadataError = true;
      render();
      const input = document.getElementById('facility-input');
      if (input) input.focus();
      return;
    }
    state.metadataError = false;
    clearProgress();
    const order = newRandomOrder();
    state.view = 'assessment'; state.step = 0; state.questionStep = 0; state.answers = {}; state.isDemo = false;
    state.dimOrder = order.dimOrder; state.questionOrder = order.questionOrder;
    render();
  };

  const resume = document.getElementById('resume-btn');
  if (resume) resume.onclick = () => {
    const saved = loadProgress();
    if (saved) {
      state.answers = saved.answers || {};
      state.step = saved.step || 0;
      state.questionStep = saved.questionStep || 0;
      state.dimOrder = saved.dimOrder || state.dimOrder;
      state.questionOrder = saved.questionOrder || state.questionOrder;
      state.metadata = saved.metadata || state.metadata;
    }
    state.isDemo = false;
    state.view = 'assessment';
    render();
  };

  const demo = document.getElementById('demo-btn');
  if (demo) demo.onclick = () => {
    state.answers = buildDemoAnswers();
    state.metadata = { facility: 'Sample Facility (Demo Data)', assessor: 'Demo', date: todayISO() };
    state.isDemo = true;
    state.questionStep = 0;
    state.view = 'results'; state.resultsTab = 'summary';
    render();
  };

  document.querySelectorAll('[data-ind]').forEach(btn => {
    btn.onclick = () => {
      state.answers[btn.dataset.ind] = parseInt(btn.dataset.idx, 10);
      render();
    };
  });

  document.querySelectorAll('[data-step]').forEach(btn => {
    btn.onclick = () => { state.step = parseInt(btn.dataset.step, 10); state.questionStep = 0; render(); };
  });

  document.querySelectorAll('[data-qstep]').forEach(btn => {
    btn.onclick = () => { state.questionStep = parseInt(btn.dataset.qstep, 10); state._animateQuestion = true; render(); };
  });

  const qPrev = document.getElementById('q-prev-btn');
  if (qPrev) qPrev.onclick = () => {
    if (state.questionStep > 0) { state.questionStep -= 1; state._animateQuestion = true; render(); }
  };

  const qNext = document.getElementById('q-next-btn');
  if (qNext) qNext.onclick = () => {
    const maxStep = (state.questionOrder[state.dimOrder[state.step]] || []).length - 1;
    if (state.questionStep < maxStep) { state.questionStep += 1; state._animateQuestion = true; render(); }
  };

  const jumpResults = document.getElementById('jump-results-btn');
  if (jumpResults) jumpResults.onclick = () => { state.view = 'results'; state.resultsTab = 'summary'; render(); };

  const back = document.getElementById('back-btn');
  if (back) back.onclick = () => { state.step = Math.max(0, state.step - 1); state.questionStep = 0; render(); };

  const next = document.getElementById('next-btn');
  if (next) next.onclick = () => {
    if (state.step === state.dimOrder.length - 1) { state.view = 'results'; state.resultsTab = 'summary'; }
    else { state.step += 1; state.questionStep = 0; }
    render();
  };

  const goHome = document.getElementById('go-home-btn');
  if (goHome) goHome.onclick = () => { state.view = 'intro'; render(); }; // non-destructive: progress stays intact

  const restart = document.getElementById('restart-btn');
  if (restart) restart.onclick = () => {
    if (confirm('Restart the assessment? All answers will be cleared.')) {
      clearProgress();
      state.view = 'intro'; state.step = 0; state.questionStep = 0; state.answers = {}; state.isDemo = false;
      state.metadata = { facility: '', assessor: '', date: todayISO() };
      state.metadataError = false;
      render();
    }
  };

  const editAnswers = document.getElementById('edit-answers-btn');
  if (editAnswers) editAnswers.onclick = () => { state.view = 'assessment'; render(); };

  const startOwn = document.getElementById('start-own-btn');
  if (startOwn) startOwn.onclick = () => {
    clearProgress();
    // Route back through the intro page rather than straight into the assessment —
    // otherwise the required-facility check below never gets a chance to run.
    state.view = 'intro'; state.step = 0; state.questionStep = 0; state.answers = {}; state.isDemo = false;
    state.metadata = { facility: '', assessor: '', date: todayISO() };
    state.metadataError = false;
    render();
  };

  document.querySelectorAll('[data-meta]').forEach(input => {
    input.oninput = () => {
      state.metadata[input.dataset.meta] = input.value;
      saveProgress();
      // Clear the facility validation error live, without a full re-render (which would drop focus mid-type)
      if (input.dataset.meta === 'facility' && state.metadataError && input.value.trim()) {
        state.metadataError = false;
        input.classList.remove('border-red-400'); input.classList.add('border-hair');
        const errMsg = input.closest('div').querySelector('p.text-red-600');
        if (errMsg) errMsg.remove();
      }
    };
  });

  const methLink = document.querySelectorAll('[data-goto-methodology]');
  methLink.forEach(el => el.onclick = () => { state.previousView = state.view; state.view = 'methodology'; render(); });

  const methBack = document.getElementById('methodology-back-btn');
  if (methBack) methBack.onclick = () => { state.view = state.previousView || 'intro'; render(); };

  const print = document.getElementById('print-btn');
  if (print) print.onclick = () => window.print();

  const resultsTabSummary = document.getElementById('results-tab-summary');
  if (resultsTabSummary) resultsTabSummary.onclick = () => { state.resultsTab = 'summary'; render(); };

  const resultsTabReferences = document.getElementById('results-tab-references');
  if (resultsTabReferences) resultsTabReferences.onclick = () => { state.resultsTab = 'references'; render(); };

  const downloadPdf = document.getElementById('download-pdf-btn');
  if (downloadPdf) downloadPdf.onclick = () => downloadReportAsPdf(downloadPdf);

  const exportCsv = document.getElementById('export-csv-btn');
  if (exportCsv) exportCsv.onclick = () => downloadDataAsCsv();

  const exportJson = document.getElementById('export-json-btn');
  if (exportJson) exportJson.onclick = () => downloadDataAsJson();
}

// Raw data export — for aggregating multiple respondents' answers into one
// dataset for external analysis (e.g. a validation study). Every row/field
// here is either a workbook-sourced fact or something the person explicitly
// entered — never the generated narrative text, which lives in the report only.
function buildExportRecord() {
  const r = computeResults();
  const indicatorRows = TOOL_DATA.indicators.map(ind => {
    const selIdx = state.answers[ind.id];
    const opt = selIdx !== undefined ? ind.options[selIdx] : null;
    const dim = TOOL_DATA.dimensions.find(d => d.name === ind.dimension);
    return {
      dimension_code: dim.code,
      dimension_name: ind.dimension,
      indicator_id: ind.id,
      indicator_label: INDICATOR_LABELS[ind.id] || ind.id,
      question: ind.question,
      selected_answer: opt ? opt.text : null,
      raw_score_1_5: opt && opt.score !== null && opt.score !== undefined ? opt.score : null,
      normalized_score_0_100: opt && opt.score !== null && opt.score !== undefined ? Math.round(((opt.score - 1) / 4) * 100 * 100) / 100 : null,
    };
  });
  const dimensionSummary = r.dimResults.map(d => ({
    dimension_code: d.code,
    dimension_name: d.dimension,
    weight: d.weight,
    average_score_0_100: d.avg !== null ? Math.round(d.avg * 100) / 100 : null,
    valid_responses: d.validCount,
    scorable: d.validCount >= 3,
  }));
  return {
    facility: state.metadata.facility || null,
    assessor: state.metadata.assessor || null,
    date: state.metadata.date || null,
    is_demo_data: state.isDemo,
    exported_at: new Date().toISOString(),
    overall_index_0_100: Math.round(r.overallIndex * 100) / 100,
    maturity_level: r.level.label,
    data_completeness_pct: Math.round(r.dataCompleteness * 10000) / 100,
    interpretation: r.interpretation,
    indicators: indicatorRows,
    dimensions: dimensionSummary,
  };
}

async function triggerDownload(filename, content, mimeType) {
  const blob = (content instanceof Blob) ? content : new Blob([content], { type: mimeType });
  // When running as a published Claude artifact, window.claude exists and a plain
  // <a download> click is silently inert — the platform requires going through the
  // downloads capability instead, which shows the viewer a save confirmation.
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) { await downloads.save({ filename, data: blob }); return; }
    } catch (e) { /* declined, unavailable, etc. — fall through to the classic method below */ }
  }
  // Standalone file (opened directly, or self-hosted elsewhere): classic browser download.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportFilenameBase() {
  const namePart = (state.metadata.facility || 'assessment').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  return `facilytics-${namePart}-${state.metadata.date || todayISO()}`;
}

function csvEscape(val) {
  if (val === null || val === undefined) return '';
  const s = String(val);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function downloadDataAsCsv() {
  const record = buildExportRecord();
  const cols = ['dimension_code', 'dimension_name', 'indicator_id', 'indicator_label', 'question',
    'selected_answer', 'raw_score_1_5', 'normalized_score_0_100'];
  const metaCols = ['facility', 'assessor', 'date', 'is_demo_data', 'overall_index_0_100', 'maturity_level', 'data_completeness_pct'];
  const header = [...metaCols, ...cols].join(',');
  const rows = record.indicators.map(ind => {
    const metaVals = metaCols.map(k => csvEscape(record[k]));
    const indVals = cols.map(k => csvEscape(ind[k]));
    return [...metaVals, ...indVals].join(',');
  });
  const csv = [header, ...rows].join('\n');
  triggerDownload(`${exportFilenameBase()}.csv`, csv, 'text/csv;charset=utf-8;');
}

function downloadDataAsJson() {
  const record = buildExportRecord();
  triggerDownload(`${exportFilenameBase()}.json`, JSON.stringify(record, null, 2), 'application/json;charset=utf-8;');
}

async function downloadReportAsPdf(triggerBtn) {
  const el = document.getElementById('report-content');
  if (!el || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    alert('PDF export isn\'t available right now — try Print instead and save as PDF from the print dialog.');
    return;
  }
  const originalLabel = triggerBtn.textContent;
  triggerBtn.textContent = 'Generating…';
  triggerBtn.disabled = true;
  // Temporarily reveal both result tabs so the PDF includes references regardless
  // of which tab is currently active on screen — restored via render() in `finally`.
  document.querySelectorAll('#report-content .results-tab-hidden').forEach(node => {
    node.classList.remove('results-tab-hidden');
    node.dataset.wasTabHidden = 'true';
  });
  try {
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#F6FBF7', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    // Slice the tall canvas across multiple A4 pages
    const pxPerPage = Math.floor((pageHeight * canvas.width) / imgWidth);
    let renderedPx = 0;
    let first = true;
    while (renderedPx < canvas.height) {
      const sliceHeight = Math.min(pxPerPage, canvas.height - renderedPx);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);
      const sliceImgHeight = (sliceHeight * imgWidth) / canvas.width;
      if (!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, sliceImgHeight);
      renderedPx += sliceHeight;
      first = false;
    }
    const namePart = (state.metadata.facility || 'assessment').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const pdfBlob = pdf.output('blob');
    await triggerDownload(`facilytics-report-${namePart}-${state.metadata.date || todayISO()}.pdf`, pdfBlob, 'application/pdf');
  } catch (err) {
    alert('PDF export failed — try Print instead and save as PDF from the print dialog.');
  } finally {
    triggerBtn.textContent = originalLabel;
    triggerBtn.disabled = false;
    render(); // restores correct tab visibility (undoes the temporary reveal above)
  }
}

/* ---- Keyboard: arrow-key navigation within each question's option group, across tabs, and across question dots ---- */
document.addEventListener('keydown', (e) => {
  const tabBtn = e.target.closest('[data-step]');
  if (tabBtn) {
    const tablist = tabBtn.closest('[role="tablist"]');
    if (tablist) {
      const tabs = Array.from(tablist.querySelectorAll('[data-step]'));
      const idx = tabs.indexOf(tabBtn);
      let newIdx = null;
      if (e.key === 'ArrowRight') newIdx = (idx + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') newIdx = (idx - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') newIdx = 0;
      else if (e.key === 'End') newIdx = tabs.length - 1;
      if (newIdx !== null) { e.preventDefault(); tabs[newIdx].focus(); tabs[newIdx].click(); }
    }
    return;
  }
  const dotBtn = e.target.closest('[data-qstep]');
  if (dotBtn) {
    const dots = Array.from(dotBtn.parentElement.querySelectorAll('[data-qstep]'));
    const idx = dots.indexOf(dotBtn);
    let newIdx = null;
    if (e.key === 'ArrowRight') newIdx = (idx + 1) % dots.length;
    else if (e.key === 'ArrowLeft') newIdx = (idx - 1 + dots.length) % dots.length;
    else if (e.key === 'Home') newIdx = 0;
    else if (e.key === 'End') newIdx = dots.length - 1;
    if (newIdx !== null) { e.preventDefault(); dots[newIdx].focus(); dots[newIdx].click(); }
    return;
  }
  const btn = e.target.closest('[data-ind]');
  if (!btn) return;
  const group = btn.closest('[data-optgroup]');
  if (!group) return;
  const opts = Array.from(group.querySelectorAll('[data-ind]'));
  const idx = opts.indexOf(btn);
  let newIdx = null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') newIdx = (idx + 1) % opts.length;
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') newIdx = (idx - 1 + opts.length) % opts.length;
  else if (e.key === 'Home') newIdx = 0;
  else if (e.key === 'End') newIdx = opts.length - 1;
  if (newIdx !== null) { e.preventDefault(); opts[newIdx].focus(); }
});

render();
</script>
